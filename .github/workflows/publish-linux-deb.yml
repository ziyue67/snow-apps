name: Publish Linux Debian

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run containing the snow-shot-linux-deb artifact
        required: true
        type: string
  push:
    branches:
      - linux-deb

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: snow-shot-linux-deb
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.run_id || '35613145307' }}

      - name: Prepare package
        run: |
          find dist -maxdepth 2 -type f -print
          deb=$(find dist -maxdepth 2 -type f -name '*.deb' -print -quit)
          test -n "$deb"
          cp "$deb" dist/snow-shot-linux-0.1.3-beta-20250702.deb
          file dist/snow-shot-linux-0.1.3-beta-20250702.deb

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-v0.1.3-beta-20250702
          target_commitish: linux-deb
          name: Snow Shot Linux Debian 0.1.3-beta-20250702
          prerelease: true
          files: dist/snow-shot-linux-0.1.3-beta-20250702.deb
