name: Build Linux Debian

on:
  workflow_dispatch:
  push:
    branches:
      - linux-deb

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: snow-apps-linux

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build custom Excalidraw
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch custom/master \
            https://github.com/mg-chao/excalidraw.git excalidraw
          npm install --global yarn@1.22.22 pnpm@10.8.1
          cd excalidraw
          yarn install --ignore-engines
          yarn build:packages

      - name: Prepare ONNX Runtime
        working-directory: snow-apps-linux
        run: |
          curl -L --fail --retry 3 -o onnxruntime.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.20.0/onnxruntime-linux-x64-1.20.0.tgz
          tar -xzf onnxruntime.tgz
          mkdir -p src-tauri/lib
          cp -a onnxruntime-linux-x64-1.20.0/lib/. src-tauri/lib/
          cp --remove-destination \
            onnxruntime-linux-x64-1.20.0/lib/libonnxruntime.so.1.20.0 \
            src-tauri/lib/libonnxruntime.so.1
          chmod +x src-tauri/deb/postinst src-tauri/deb/prerm
          ls -l src-tauri/lib src-tauri/deb
          mkdir -p src-tauri/ffmpeg
          touch src-tauri/ffmpeg/.gitkeep

      - name: Install frontend dependencies
        working-directory: snow-apps-linux
        run: pnpm install --frozen-lockfile

      - name: Build Debian package
        working-directory: snow-apps-linux
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS="-I$(gcc -print-file-name=include) -I/usr/include -I/usr/include/x86_64-linux-gnu"
          pnpm tauri build --bundles deb

      - name: Verify Debian package
        working-directory: snow-apps-linux
        run: |
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb -c "$deb" | grep -F 'usr/lib/Snow Shot/lib/libonnxruntime.so.1'
          dpkg-deb -I "$deb" | grep -E 'postinst|prerm'
          tmp=$(mktemp -d)
          dpkg-deb -x "$deb" "$tmp"
          LD_LIBRARY_PATH="$tmp/usr/lib/Snow Shot/lib" ldd "$tmp/usr/bin/app" | tee /tmp/snow-shot-ldd.txt
          if grep -q 'not found' /tmp/snow-shot-ldd.txt; then
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-linux-deb
          path: snow-apps-linux/src-tauri/target/release/bundle/deb/*.deb

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-v0.1.3-beta-20250702
          target_commitish: ${{ github.sha }}
          name: Snow Shot Linux Debian 0.1.3-beta-20250702
          prerelease: true
          files: snow-apps-linux/src-tauri/target/release/bundle/deb/*.deb
